description = "moqx on its mvfst and picoquic listeners, on the same 4 cores of a c7a.4xlarge"
deployment  = "aws-c7a-4x"
relays      = ["moqx:pgo"]
suites      = ["relay-efficiency-4core"]
threads     = 4
slo_ms      = 500
budget      = { hours = 2 }
teardown    = true

[builds]
# moqx's v0.3.7 release tarball, moqx-linux-amd64.tar.gz (PGO+LTO)
moqx     = "patches/bin/moqx-v0.3.7-linux-amd64.tar.gz"
moxygen  = "v0.3.7"
aiomoqt  = "f94032d"
aiopquic = "84d137a"
python   = "3.14"
