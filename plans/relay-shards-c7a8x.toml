description = "aiomoqt-relay with 1 to 4 picoquic workers at 2160p on 4 cores of a c7a.8xlarge"
deployment  = "aws-c7a-8x"
relays      = ["aiomoqt:src"]
suites      = ["relay-shards-2160"]
threads     = 4
slo_ms      = 500
budget      = { hours = 3 }
teardown    = true

[builds]
aiomoqt  = "9d64a78"
aiopquic = "36b175b"
python   = "3.14"
