# A c7a.4xlarge relay for its 6.25 Gbps network baseline, so relays pinned to
# a few of its cores run out of CPU before the NIC shapes them, and two
# c7a.2xlarge load hosts. AMD Genoa, one core per vCPU, one cluster placement
# group. Your account settings go in deployments/aws.local.toml.
provider = "aws"
region   = "us-west-2"
zone     = "us-west-2a"
arch     = "amd64"
tag      = "c7a4x"

[[nodes]]
name     = "relay"
instance = "c7a.4xlarge"
vcpus    = 16
roles    = ["relay"]

[[nodes]]
name     = "load-1"
instance = "c7a.2xlarge"
roles    = ["subscriber"]

[[nodes]]
name     = "load-2"
instance = "c7a.2xlarge"
roles    = ["subscriber", "publisher"]
