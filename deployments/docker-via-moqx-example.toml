# Control for docker-via-example: the same ring and node metrics with moqx as
# both vias, so loss in a run attributes to the via or to the ends.
provider = "docker"
host     = "local"
tag      = "viamx"

[fabric]
adapter  = "moqx-peering"
image    = "moqx-peering:latest"          # bin/moqx-peering-build.sh
topology = "ring"
order    = ["laps", "via-1", "moqx", "via-2"]
draft    = 18
check_interval_ms = 2000

[[nodes]]
name        = "laps"
roles       = ["relay"]
adapter     = "laps"
image       = "laps:latest"               # bin/laps-build.sh
admin_image = "laps:builder-latest"       # carries lapsAdmin
cpus        = "2-3"

[[nodes]]
name        = "via-1"
roles       = ["relay"]
node_metric = 100
cpus        = "4-5"

[[nodes]]
name  = "moqx"
roles = ["relay"]
cpus  = "6-7"

[[nodes]]
name        = "via-2"
roles       = ["relay"]
node_metric = 200
cpus        = "8-9"

[[nodes]]
name  = "client"
roles = ["publisher", "subscriber", "probe"]
cpus  = "10-15"
