# One relay and two load hosts, Graviton3 at 150 Gbps, in one cluster placement
# group. Your account settings go in deployments/aws.local.toml.
provider = "aws"
region   = "us-west-2"
zone     = "us-west-2a"
arch     = "arm64"
tag      = "12x"

[[nodes]]
name     = "relay"
instance = "c7gn.12xlarge"
vcpus    = 48
roles    = ["relay"]

[[nodes]]
name     = "load-1"
instance = "c7gn.12xlarge"
roles    = ["subscriber"]

[[nodes]]
name     = "load-2"
instance = "c7gn.12xlarge"
roles    = ["subscriber", "publisher"]
