# The Graviton3E counterpart of aws-c7a-4x: a c7gn.4xlarge relay whose 16 cores
# leave room to pin a relay to a few, and two c7gn.2xlarge load hosts, in one
# cluster placement group. Your account settings go in deployments/aws.local.toml.
provider = "aws"
region   = "us-west-2"
zone     = "us-west-2a"
arch     = "arm64"
tag      = "c7gn4x"

[[nodes]]
name     = "relay"
instance = "c7gn.4xlarge"
vcpus    = 16
roles    = ["relay"]

[[nodes]]
name     = "load-1"
instance = "c7gn.2xlarge"
roles    = ["subscriber"]

[[nodes]]
name     = "load-2"
instance = "c7gn.2xlarge"
roles    = ["subscriber", "publisher"]
