# Example: a relay and two load hosts on 4-OCPU AMD E6 VMs in one availability
# domain; set region to yours. Your account settings go in
# deployments/oci.local.toml (see oci.local.toml.example), with an amd64 image
# as image_ocid_amd64 when image_ocid is an Arm one.
provider = "oci"
region   = "us-ashburn-1"
arch     = "amd64"
tag      = "ociex"

[[nodes]]
name      = "relay"
instance  = "VM.Standard.E6.Flex"
ocpus     = 4
memory_gb = 16
vcpus     = 8
roles     = ["relay"]

[[nodes]]
name      = "load-1"
instance  = "VM.Standard.E6.Flex"
ocpus     = 4
memory_gb = 16
roles     = ["subscriber"]

[[nodes]]
name      = "load-2"
instance  = "VM.Standard.E6.Flex"
ocpus     = 4
memory_gb = 16
roles     = ["subscriber", "publisher"]
