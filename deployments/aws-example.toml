# Example: a relay and two load hosts on c7a.2xlarge (8 vCPUs, 3.125 Gbps
# baseline) in one cluster placement group. Your account settings go in
# deployments/aws.local.toml (see aws.local.toml.example).
provider = "aws"
region   = "us-west-2"
zone     = "us-west-2a"
arch     = "amd64"
tag      = "awsex"

[[nodes]]
name     = "relay"
instance = "c7a.2xlarge"
vcpus    = 8
roles    = ["relay"]

[[nodes]]
name     = "load-1"
instance = "c7a.2xlarge"
roles    = ["subscriber"]

[[nodes]]
name     = "load-2"
instance = "c7a.2xlarge"
roles    = ["subscriber", "publisher"]
