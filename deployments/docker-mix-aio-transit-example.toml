# Example: aiomoqt-relay as the transit relay of a mixed moq-fabric triangle on the
# local Docker, with moqx and LAPS. The order makes moqx the ingest (publisher)
# relay, aio the transit and laps the egress. moqx's direct session to laps
# costs 300, so traffic goes through aio until metric-flip makes the direct link
# cheaper.
# Clients use MoQT draft 18, the only draft LAPS clients speak. The aiomoqt-relay
# image is the lab image plus aiomoqt from peer_pip.
provider = "docker"
host     = "local"
tag      = "mixtr"

[fabric]
adapter  = "moqx-peering"
image    = "moqx-peering:latest"          # bin/moqx-peering-build.sh
topology = "full"
order    = ["moqx", "aio", "laps"]
metrics  = [["moqx", "laps", 300]]
draft    = 18
check_interval_ms = 2000

[[nodes]]
name        = "moqx"
roles       = ["relay"]
cpus        = "2-3"

[[nodes]]
name        = "aio"
roles       = ["relay"]
adapter     = "aiomoqt-relay"
cpus        = "4-5"

[[nodes]]
name        = "laps"
roles       = ["relay"]
adapter     = "laps"
image       = "laps:latest"               # bin/laps-build.sh
admin_image = "laps:builder-latest"       # carries lapsAdmin
cpus        = "6-7"

[[nodes]]
name  = "client"
roles = ["publisher", "subscriber", "probe"]
cpus  = "8-11"
