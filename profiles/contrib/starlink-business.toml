id = "starlink-business"
name = "Starlink business uplink"
role = "realistic"
description = "LEO uplink on a business plan: 30 Mb/s capacity and the base delay redrawn every 15 s, 0.4% loss in short bursts each way, and a 60 ms loss burst at each reconfiguration (burst length and the spread of the redraws assumed)."
basis = "Tanveer et al., Making Sense of Constellations (CoNEXT 2023): 15 s reconfiguration; Michel et al., A First Look at Starlink Performance (IMC 2022): about 0.4% loss for a video-like flow, mostly single packets; business uplink 20-40 Mb/s"
rtt_ms = 40

[forward]
loss = { gemodel = [0.308928, 76.923077, 100, 0] }
cap_mbit = 30
cap_latency_ms = 150
seed = 4051

[reverse]
loss = { gemodel = [0.308928, 76.923077, 100, 0] }
seed = 4052

