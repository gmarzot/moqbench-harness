id = "B1"
name = "Bloated cable uplink"
description = "A 2.5x uplink behind a 500 ms drop-tail buffer, shared with a TCP upload that runs 20 s on, 20 s off."
basis = "Gettys and Nichols, Bufferbloat: Dark Buffers in the Internet (ACM Queue, 2011); Kreibich et al., Netalyzr (IMC 2010)"
rtt_ms = 30

[forward]
cap = 2.5
cap_latency_ms = 500
seed = 3101

[reverse]
seed = 3102

[[event]]
kind = "cross"
label = "tcp-upload"
at_s = 20
every_s = 40
for_s = 20
