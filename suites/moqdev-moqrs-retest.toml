description = "moq-dev worker mode and moq-rs at draft 18, with the current load client"
requires = { subscriber = 2, publisher = 1 }

[[test]]
relay = "moqdev"
type = "capacity"
tool = "aiomoqt"
video = "720p"
max_per_box = 12000
seconds = 600
step_subs = 250
join_s = 5
stagger_s = 0.01
stop_at_ceiling = 1

[[test]]
relay = "moqdev"
type = "capacity"
tool = "aiomoqt"
video = "1080p"
max_per_box = 8000
seconds = 600
step_subs = 250
join_s = 5
stagger_s = 0.01
stop_at_ceiling = 1

[[test]]
relay = "cf"
note = "Ramps slowly and runs on past a crossing, since moq-rs stalled at larger steps"
type = "capacity"
tool = "aiomoqt"
video = "720p"
max_per_box = 2000
seconds = 400
step_subs = 10
join_s = 5

[[test]]
relay = "cf"
note = "Whether moq-rs does better with fewer workers than relay vCPUs"
type = "capacity"
tool = "aiomoqt"
video = "720p"
threads = 3
max_per_box = 2000
seconds = 400
step_subs = 10
join_s = 5

[[test]]
relay = "moqdev"
note = "Whether moq-dev's crossings depend on the ramp: slower, and past any crossing"
type = "capacity"
tool = "aiomoqt"
video = "720p"
max_per_box = 4000
seconds = 400
step_subs = 50
join_s = 5
suffix = "slow"
