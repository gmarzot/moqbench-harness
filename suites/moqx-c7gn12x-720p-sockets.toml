description = "720p with a source port per subscriber on one picoquic worker, against moqperf"
requires = { subscriber = 2, publisher = 1 }

[[test]]
type = "capacity"
tool = "moqperf"
video = "720p"
max_per_box = 12000
seconds = 550

[[test]]
type = "capacity"
tool = "aiomoqt"
video = "720p"
max_per_box = 12000
seconds = 300
step_subs = 100
join_s = 2
stagger_s = 0.01
stop_at_ceiling = 1
suffix = "k100"

[[test]]
type = "capacity"
tool = "aiomoqt"
video = "720p"
max_per_box = 12000
seconds = 300
step_subs = 250
join_s = 5
stagger_s = 0.01
stop_at_ceiling = 1
suffix = "k250"
