description = "Each relay on the same 4 pinned cores holding half its load while new subscribers join at rising rates, at 720p and 1080p"
requires = { subscriber = 2, publisher = 1 }

[[test]]
relay = "moqx"
suffix = "join"
type = "capacity"
tool = "aiomoqt"
video = "720p"
max_per_box = 600
seconds = 300
step_subs = 50
join_s = 2
stop_at_ceiling = 1
relay_cpus = "4-7"
join_steps = "10,25,50,100,200"

