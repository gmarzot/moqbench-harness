description = "Each relay on the same 4 pinned cores under a base load, while one host finds the largest batch of new subscribers it admits at once, at 720p and 1080p"
requires = { subscriber = 2, publisher = 1 }

[[test]]
relay = "moqx"
suffix = "join"
type = "capacity"
tool = "aiomoqt"
video = "720p"
max_per_box = 750
seconds = 400
step_subs = 50
join_s = 2
stop_at_ceiling = 1
relay_cpus = "4-7"
searcher_subs = 400
join_search = 5
join_max = 296

