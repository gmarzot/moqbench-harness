description = "Each relay on the same 4 pinned cores, aiomoqt load from two hosts, ramping to its first crossing of the latency SLO"
requires = { subscriber = 2, publisher = 1 }

[[test]]
relay = "cf"
suffix = "ramp"
note = "Ramps slowly, since moq-rs stalled at larger steps"
type = "capacity"
tool = "aiomoqt"
video = "720p"
