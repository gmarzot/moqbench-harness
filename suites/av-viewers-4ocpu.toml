description = "Each relay on the same 4 pinned OCPUs at 1080p, one aiomoqt load host: video only, then catalog and audio beside video with audio on streams or datagrams, stepped to its equilibrium, confirmed for 60 s"
requires = { subscriber = 1, publisher = 1 }

[[test]]
relay = "moqx"
note = "Whether this relay carries the audio datagrams, at 100 viewers"
type = "capacity"
tool = "aiomoqt"
video = "1080p"
max_per_box = 100
seconds = 120
step_subs = 100
join_s = 5
stop_at_ceiling = 1
confirm_s = 30
relay_cpus = "4-11"
hold_s = 20
aiomoqt_extra = "--audio --catalog -D"
suffix = "smoke-dgram"

