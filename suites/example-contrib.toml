description = "Contribution transports on the profile grid: SRT and RIST at equal latency budgets, MoQT lanes at fixed playout buffers, the 20 Mb/s MPEG-2 source. Run with moqbench contrib run."

[[test]]
type       = "contribution"
lanes      = ["srt", "rist", "moqt-moq2ts", "moqt-aiomoqt-loc", "moqt-aiomoqt-msfts"]
profiles   = ["lan", "random-loss", "regional-clean", "national-managed", "transcontinental", "intercontinental-good", "longhaul-lossy", "intercontinental-bad", "cellular-handover", "leo-satellite", "outage-ladder"]
source     = "mpeg2-20m"
scenario   = "standard"
repeats    = 3
placement  = "last-mile"
rtt_multiples = [2, 3, 4, 6]
rtt_floor_ms  = 20
budgets_ms    = [200, 300]
playout_ms    = [300, 200]
relay_cc      = ["bbr2", "bbr", "cubic"]
pub_timing    = ["none", "mapping"]
note = "SRT latency and RIST buffer equal each budget D; MoQT lanes run once per relay congestion controller, the one on the impaired hop, and are scored at every D"

[[test]]
type      = "contribution"
lanes     = ["srt", "rist", "moqt-moq2ts", "moqt-aiomoqt-loc", "moqt-aiomoqt-msfts"]
profiles  = ["random-loss", "transcontinental", "longhaul-lossy", "intercontinental-bad"]
source    = "mpeg2-20m"
placement = "first-mile"
relay_cc  = ["bbr2"]
pub_cc    = ["bbr", "bbr1", "cubic", "c4"]
note      = "the impairment between publisher and relay instead, so the aiomoqt publisher's congestion controller is on the impaired hop"

[[test]]
type     = "contribution"
lanes    = ["srt", "rist", "moqt-moq2ts"]
profiles = ["random-loss", "transcontinental"]
source   = "mpeg2-8m"
relay_cc = ["bbr2"]
suffix   = "8m"

[[test]]
type     = "contribution"
lanes    = ["srt", "rist", "moqt-moq2ts"]
profiles = ["random-loss", "transcontinental"]
source   = "mpeg2-40m"
relay_cc = ["bbr2"]
suffix   = "40m"

[[test]]
type      = "contribution"
lanes     = ["moqt-moq2ts", "moqt-aiomoqt-msfts"]
profiles  = ["random-loss", "transcontinental", "longhaul-lossy", "intercontinental-bad"]
source    = "mpeg2-20m"
relay     = "aiomoqt"
relay_cc  = ["bbr", "bbr1"]
note      = "aiomoqt-relay in place of moqx on the impaired last-mile hop, so picoquic's controllers carry it"
