description = "Example: a three-relay fabric on VMs. Steady per-hop delivery on a line and a triangle, peer changes during live delivery, namespace propagation and subscribe setup, fan-out at the egress relay, audiences on every relay, late join with a catalog, and FETCH across peering. Run with moqbench fabric run."
requires    = { relay = 3, subscriber = 1, probe = 1 }

