description = "Example: a mixed moqx / LAPS / aiomoqt-relay triangle at MoQT draft 18, run once per rotation (deployments/docker-mix-aio-{ingest,transit,egress}-example.toml) so aiomoqt-relay is measured as the publisher's, the transit and the subscriber's relay. Steady delivery, propagation and subscribe setup, path changes through each relay's control API, late join, FETCH, datagrams, relay restarts, audiences on every relay and multi-tuple namespaces."
requires    = { relay = 3, subscriber = 1 }

