; Audio + 1080p video, upstream's config-av-1080: 120 B datagram audio every
; 20 ms beside the video track. Exercises datagram and stream paths together.
; relay-load.sh rewrites start_delay and total_transmit_time per run.
[Audio]
namespace           = perf/audio/{}
name                = 1
track_mode          = datagram
priority            = 2
ttl                 = 5000
time_interval       = 20
objects_per_group   = 1
first_object_size   = 120
object_size         = 120
start_delay         = 5000
total_transmit_time = 60000

[Video]
namespace           = perf/video/{}
name                = 1
track_mode          = stream
priority            = 3
ttl                 = 5000
time_interval       = 33.33
objects_per_group   = 150
first_object_size   = 64000
object_size         = 8000
start_delay         = 5000
total_transmit_time = 60000
