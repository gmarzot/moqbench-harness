; One 1080p-shaped video track, ~2 Mbps: a 64 KB first object then 8 KB
; objects every 33.33 ms, 150 per group (5 s GOP). Upstream's config-av-1080
; video section, alone, so subscriber count is the only load axis.
;
; relay-load.sh rewrites start_delay and total_transmit_time per run: start_delay
; must outlast the subscriber launch, or early objects go to nobody and every
; subscriber reports a delta. Namespace {} is filled with 0 on both ends.
[Video]
namespace           = perf/video/{}
name                = 1
track_mode          = stream
priority            = 3
ttl                 = 5000
time_interval       = 33.33
objects_per_group   = 150
first_object_size   = 64000
object_size         = 8000
start_delay         = 5000
total_transmit_time = 60000
